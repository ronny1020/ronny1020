<svg xmlns="http://www.w3.org/2000/svg" width="320" height="190" viewBox="0 0 320 190" role="img" aria-labelledby="t">
  <title id="t">A black cat lying curled up on a laptop, typing with its front paws late at night while code types itself out on the screen</title>
  <style>
    .line { transform-box: fill-box; transform-origin: left; transform: scaleX(0); }
    .l1 { animation: l1 7s steps(8) infinite; }
    .l2 { animation: l2 7s steps(6) infinite; }
    .l3 { animation: l3 7s steps(9) infinite; }
    .l4 { animation: l4 7s steps(5) infinite; }
    .l5 { animation: l5 7s steps(7) infinite; }
    .cursor { animation: cursor 0.8s steps(1) infinite; }
    .breath { transform-box: fill-box; transform-origin: center bottom; animation: breath 3.2s ease-in-out infinite alternate; }
    .doze { animation: doze 3.2s ease-in-out infinite alternate; }
    .tail { transform-box: view-box; transform-origin: 124px 154px; animation: swish 4s ease-in-out infinite alternate; }
    .twinkle { animation: twinkle 2.4s ease-in-out infinite alternate; }
    .twinkle.late { animation-delay: -1.2s; }
    .steam { animation: steam 2.8s ease-out infinite; opacity: 0; }
    .steam.late { animation-delay: -1.4s; }
    .glyph { animation: rise 3.6s ease-out infinite; opacity: 0; }
    .glyph.g2 { animation-delay: -1.2s; }
    .glyph.g3 { animation-delay: -2.4s; }
    .pivot { transform-box: fill-box; transform-origin: center; }
    .blink { animation: blink 4s infinite; }
    .left-paw { animation: tap 0.36s ease-in-out infinite alternate; }
    .right-paw { animation: tap 0.36s ease-in-out -0.18s infinite alternate; }

    @keyframes l1 { 0% { transform: scaleX(0); } 12%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @keyframes l2 { 0%, 14% { transform: scaleX(0); } 26%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @keyframes l3 { 0%, 28% { transform: scaleX(0); } 44%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @keyframes l4 { 0%, 46% { transform: scaleX(0); } 56%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @keyframes l5 { 0%, 58% { transform: scaleX(0); } 72%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @keyframes cursor { 50% { opacity: 0; } }
    @keyframes breath { to { transform: scaleY(1.05); } }
    @keyframes doze { to { transform: translateY(1.2px); } }
    @keyframes swish { from { transform: rotate(-2deg); } to { transform: rotate(3deg); } }
    @keyframes twinkle { from { opacity: 0.25; } to { opacity: 1; } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 30% { opacity: 0.7; } 100% { opacity: 0; transform: translateY(-14px); } }
    @keyframes rise { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -34px); } }
    @keyframes blink { 0%, 92%, 98%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes tap { to { transform: translateY(-2.5px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .line { transform: scaleX(1); }
    }
  </style>
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7a8cc4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7a8cc4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- room -->
  <rect width="320" height="190" rx="16" fill="#12151f"/>
  <rect x="22" y="20" width="62" height="52" rx="6" fill="#1b2233"/>
  <circle cx="66" cy="38" r="9" fill="#d9cf9f"/>
  <circle cx="70" cy="35" r="8" fill="#1b2233"/>
  <circle class="twinkle" cx="34" cy="32" r="1.4" fill="#d9cf9f"/>
  <circle class="twinkle late" cx="46" cy="56" r="1.2" fill="#d9cf9f"/>
  <circle class="twinkle" cx="74" cy="60" r="1" fill="#d9cf9f"/>
  <path d="M53 20v52M22 46h62" stroke="#12151f" stroke-width="3"/>
  <rect y="158" width="320" height="32" fill="#1d1b2b"/>
  <rect y="158" width="320" height="3" fill="#2a2740"/>

  <!-- books and desk lamp -->
  <rect x="30" y="150" width="38" height="8" rx="1" fill="#3a4f6b"/>
  <rect x="33" y="143" width="33" height="7" rx="1" fill="#6b3a4a"/>
  <rect x="31" y="137" width="36" height="6" rx="1" fill="#4a5a3a"/>
  <path d="M34 154h30M37 146.5h25M35 140h28" stroke="#ffffff" stroke-width="0.6" opacity="0.15"/>
  <ellipse cx="16" cy="157" rx="9" ry="2.5" fill="#2c3142"/>
  <path d="M16 156l4-32 14-16" stroke="#2c3142" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="124" r="2" fill="#3d4566"/>
  <path d="M30 116l18 4 30 38H22z" fill="#e0af68" opacity="0.07"/>
  <ellipse cx="50" cy="158" rx="28" ry="4" fill="#e0af68" opacity="0.1"/>
  <path d="M32 104l18 6-4 10-18-6z" fill="#2c3142" stroke="#3d4566" stroke-width="1" stroke-linejoin="round"/>
  <circle cx="39" cy="117" r="2" fill="#f4d38a" opacity="0.85"/>

  <!-- succulent -->
  <g fill="#3f6b4a">
    <ellipse cx="80" cy="132" rx="3.5" ry="9" transform="rotate(-35 80 132)"/>
    <ellipse cx="94" cy="132" rx="3.5" ry="9" transform="rotate(35 94 132)"/>
    <ellipse cx="87" cy="128" rx="3.5" ry="10"/>
  </g>
  <g fill="#5a8a5f">
    <ellipse cx="83" cy="135" rx="3" ry="7" transform="rotate(-60 83 135)"/>
    <ellipse cx="91" cy="135" rx="3" ry="7" transform="rotate(60 91 135)"/>
  </g>
  <path d="M76 140h22l-3 18h-16z" fill="#5a3b30"/>
  <rect x="75" y="139" width="24" height="4" rx="1" fill="#6b4637"/>

  <!-- laptop -->
  <rect x="152" y="36" width="136" height="94" rx="6" fill="#2c3142" stroke="#3d4566" stroke-width="1"/>
  <rect x="158" y="42" width="124" height="80" rx="3" fill="#0b0e17"/>
  <circle cx="166" cy="50" r="2.5" fill="#f7768e"/>
  <circle cx="174" cy="50" r="2.5" fill="#e0af68"/>
  <circle cx="182" cy="50" r="2.5" fill="#9ece6a"/>
  <rect class="line l1" x="166" y="60" width="64" height="4" rx="2" fill="#bb9af7"/>
  <rect class="line l2" x="174" y="71" width="46" height="4" rx="2" fill="#7aa2f7"/>
  <rect class="line l3" x="174" y="82" width="80" height="4" rx="2" fill="#9ece6a"/>
  <rect class="line l4" x="182" y="93" width="38" height="4" rx="2" fill="#7dcfff"/>
  <rect class="line l5" x="166" y="104" width="58" height="4" rx="2" fill="#f7768e"/>
  <rect class="cursor" x="166" y="111" width="6" height="6" fill="#c0caf5"/>
  <path d="M146 158h150l-8-28H152z" fill="#3b4156"/>
  <path d="M160 137h120M158 143h124M156 149h128" stroke="#2a2f3e" stroke-width="3"/>

  <!-- coffee -->
  <path class="steam" d="M268 158c-3-4 3-6 0-10" stroke="#6b7290" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path class="steam late" d="M276 158c-3-4 3-6 0-10" stroke="#6b7290" stroke-width="2" fill="none" stroke-linecap="round"/>
  <rect x="262" y="163" width="20" height="21" rx="3" fill="#5d6478"/>
  <path d="M282 168a5 5 0 0 1 0 10" stroke="#5d6478" stroke-width="3" fill="none"/>
  <ellipse cx="272" cy="165" rx="8" ry="1.6" fill="#2a1d18"/>

  <!-- cat -->
  <circle cx="182" cy="132" r="70" fill="url(#glow)"/>
  <g transform="translate(175 158) scale(1.15) translate(-175 -158)">
    <path class="breath" d="M120 157c0-22 22-36 54-36s50 14 52 36z" fill="#17181f" stroke="#4a5272" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M140 151c3-13 18-20 32-15" stroke="#4a5272" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <g class="tail" stroke-linecap="round" fill="none">
      <path d="M124 152c6 9 36 10 64 4 7-1 11-4 12-8" stroke="#4a5272" stroke-width="8.5"/>
      <path d="M124 152c6 9 36 10 64 4 7-1 11-4 12-8" stroke="#17181f" stroke-width="6"/>
    </g>
    <g class="doze">
      <path d="M200 129l1-15 11 9zM226 127l3-14-12 6z" fill="#17181f" stroke="#4a5272" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M202.5 125l.8-7.5 5.5 4.5zM224.5 123.5l1.5-7-6 3z" fill="#5a3a4a"/>
      <ellipse cx="214" cy="137" rx="18" ry="14" fill="#17181f" stroke="#4a5272" stroke-width="1.2"/>
      <g class="pivot blink">
        <ellipse cx="209" cy="136.6" rx="2.5" ry="2.9" fill="#e8c547"/>
        <ellipse cx="220" cy="136.6" rx="2.5" ry="2.9" fill="#e8c547"/>
        <ellipse cx="209" cy="136.8" rx="0.8" ry="2.1" fill="#0d0e14"/>
        <ellipse cx="220" cy="136.8" rx="0.8" ry="2.1" fill="#0d0e14"/>
        <circle cx="209.9" cy="135.6" r="0.6" fill="#fff"/>
        <circle cx="220.9" cy="135.6" r="0.6" fill="#fff"/>
      </g>
      <path d="M205.6 138.7q3.4-1.7 6.8 0v3h-6.8zM216.6 138.7q3.4-1.7 6.8 0v3h-6.8z" fill="#17181f"/>
      <path d="M206 135q3-3.2 6 0M217 135q3-3.2 6 0" stroke="#6a7090" stroke-width="0.9" fill="none" stroke-linecap="round"/>
      <ellipse cx="203" cy="142" rx="2.6" ry="1.3" fill="#ff8a9a" opacity="0.25"/>
      <ellipse cx="226" cy="142" rx="2.6" ry="1.3" fill="#ff8a9a" opacity="0.25"/>
      <path d="M213 141h3l-1.5 2z" fill="#d9879a"/>
      <path d="M212.2 144q1.15 1.1 2.3 0q1.15 1.1 2.3 0" stroke="#8a90a8" stroke-width="0.8" fill="none" stroke-linecap="round"/>
      <path d="M206 142l-12-1.5M206 144l-12 1.5M223 142l12-1.5M223 144l12 1.5" stroke="#9aa3b8" stroke-width="0.6" stroke-linecap="round"/>
    </g>
    <ellipse class="left-paw" cx="206" cy="152" rx="6" ry="3.5" fill="#17181f" stroke="#4a5272" stroke-width="1.2"/>
    <ellipse class="right-paw" cx="221" cy="153" rx="6" ry="3.5" fill="#17181f" stroke="#4a5272" stroke-width="1.2"/>
  </g>
  <!-- code glyphs rising from the paws -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700">
    <text class="glyph" x="228" y="140" fill="#7dcfff">&lt;/&gt;</text>
    <text class="glyph g2" x="240" y="146" fill="#bb9af7">{ }</text>
    <text class="glyph g3" x="234" y="134" fill="#9ece6a">;</text>
  </g>
</svg>
